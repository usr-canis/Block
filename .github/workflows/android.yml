name: Android build and release

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Configure Android SDK
        uses: android-actions/setup-android@v3
      - name: Configure release signing
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          KEYSTORE_BASE64: ${{ secrets.ROADSCOPE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ROADSCOPE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ROADSCOPE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ROADSCOPE_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "HAS_RELEASE_KEY=false" >> "$GITHUB_ENV"
            exit 0
          fi
          echo "HAS_RELEASE_KEY=true" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/roadscope-signing"
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/roadscope-signing/release.jks"
          echo "ROADSCOPE_KEYSTORE=$RUNNER_TEMP/roadscope-signing/release.jks" >> "$GITHUB_ENV"
          echo "ROADSCOPE_STORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "ROADSCOPE_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "ROADSCOPE_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
      - name: Build debug APK
        if: ${{ !startsWith(github.ref, 'refs/tags/v') || env.HAS_RELEASE_KEY != 'true' }}
        run: ./gradlew :app:assembleDebug
      - name: Build signed release APK
        if: ${{ startsWith(github.ref, 'refs/tags/v') && env.HAS_RELEASE_KEY == 'true' }}
        run: ./gradlew :app:assembleRelease
      - name: Upload debug build
        if: ${{ !startsWith(github.ref, 'refs/tags/v') || env.HAS_RELEASE_KEY != 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: Roadscope-debug
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Create GitHub release
        if: ${{ startsWith(github.ref, 'refs/tags/v') && env.HAS_RELEASE_KEY == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/Roadscope-${TAG}.apk"
          sha256sum "$RUNNER_TEMP/Roadscope-${TAG}.apk" > "$RUNNER_TEMP/SHA256SUMS.txt"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$RUNNER_TEMP/Roadscope-${TAG}.apk" "$RUNNER_TEMP/SHA256SUMS.txt" --clobber
          else
            gh release create "$TAG" "$RUNNER_TEMP/Roadscope-${TAG}.apk" "$RUNNER_TEMP/SHA256SUMS.txt" --generate-notes --title "Roadscope ${TAG}"
          fi
